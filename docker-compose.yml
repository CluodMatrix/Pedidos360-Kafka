# Paso 1: levantar Kafka (ZooKeeper + broker) + Kafka UI
#   docker compose up -d
#   docker compose ps
#   Kafka UI: http://localhost:8080
#
# ¿Por que dos puertos?
#   29092 -> para otros contenedores de la red Docker (Kafka UI).
#   9092  -> para tu codigo Node en tu computador (localhost).
# Si falla la conexion, casi siempre es este detalle.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on: [zookeeper]
    ports: ['9092:9092']
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'   # los topicos se crean desde codigo (admin)
      # Ajustes para el experimento de replicacion
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # El broker revisa la retencion cada 5s en vez de cada 5min.
      # Sin esto, la demo de retencion (30s) NO llegaria a borrar nada y el
      # "low water mark" jamas subiria. Es config del BROKER, no del topico.
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: '5000'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [kafka]
    ports: ['8080:8080']
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Mostrar los topics y los consumer groups con detalle (lag, ISR).
      DYNAMIC_CONFIG_ENABLED: 'true'
